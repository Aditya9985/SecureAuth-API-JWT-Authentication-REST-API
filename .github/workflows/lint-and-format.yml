name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/eslint.log

      - name: Run Prettier Check
        id: prettier
        continue-on-error: true
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee /tmp/prettier.log

      - name: Annotate failures with fix suggestions
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: |
          echo "::error title=Lint/Format check failed::Fix the issues below, then run 'npm run lint:fix' and 'npm run format' locally."

          if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
            echo "::error title=ESLint issues found::Run 'npm run lint:fix' to auto-fix ESLint issues."
            if [ -f /tmp/eslint.log ]; then
              grep -E "error|warning" /tmp/eslint.log | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
          fi

          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            echo "::error title=Prettier formatting issues found::Run 'npm run format' to auto-format your code."
            if [ -f /tmp/prettier.log ]; then
              head -50 /tmp/prettier.log | while IFS= read -r line; do
                [ -n "$line" ] && echo "::warning::$line"
              done
            fi
          fi

          exit 1

      - name: Upload lint logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-format-logs
          path: |
            /tmp/eslint.log
            /tmp/prettier.log
          retention-days: 7