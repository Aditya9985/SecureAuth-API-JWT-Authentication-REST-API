name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Docker Hub username
        id: image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          USERNAME="$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')"
          if [[ -z "$USERNAME" ]]; then
            echo "::error title=Docker secrets missing::Set DOCKER_USERNAME (your Docker Hub username) and DOCKER_PASSWORD repository secrets to publish the image."
            exit 1
          fi
          if ! [[ "$USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error title=Invalid Docker Hub username::The DOCKER_USERNAME secret must be a lowercase Docker Hub account name (no spaces or newlines). Got: '$USERNAME'"
            exit 1
          fi
          echo "image=$USERNAME/secureauth-api-dev" >> "$GITHUB_OUTPUT"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub password
        if: env.DOCKER_PASSWORD == ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "::error title=Docker secrets missing::Set DOCKER_PASSWORD repository secret to publish the image."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.image.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append GitHub summary with published image
        if: always()
        run: |
          {
            echo "## Published Docker Image"
            echo ""
            echo "- **Registry:** ${{ env.REGISTRY }}"
            echo "- **Image:** \`${{ steps.image.outputs.image }}\`"
            echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### Tags"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Published by:** ${{ github.workflow }} #${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"
