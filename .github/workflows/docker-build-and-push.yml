name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/secureauth-api-dev

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        if: secrets.DOCKER_USERNAME == '' || secrets.DOCKER_PASSWORD == ''
        run: |
          echo "::error title=Docker secrets missing::Set DOCKER_USERNAME and DOCKER_PASSWORD repository secrets to publish the image."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append GitHub summary with published image
        if: always()
        run: |
          {
            echo "## Published Docker Image"
            echo ""
            echo "- **Registry:** ${{ env.REGISTRY }}"
            echo "- **Image:** \`${{ env.IMAGE_NAME }}\`"
            echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### Tags"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Published by:** ${{ github.workflow }} #${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"
